<!DOCTYPE html>
<html lang="zh">
<head>
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-database-compat.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>太初烬寰 6.0 · 修仙模拟器</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">
        <header>
            <h1>✨ 太初烬寰 6.0 ✨</h1>
            <div id="realm-bar">
                <span id="realm-name">凡人</span>
                <span id="realm-stage">前期一层</span>
                <span id="title-display"></span>
            </div>
            <div id="sect-display"></div>
        </header>

        <div id="stats">
            <div class="stat"><span>修为</span><b id="stat-power">0</b></div>
            <div class="stat"><span>灵石</span><b id="stat-stone">0</b></div>
            <div class="stat"><span>灵力</span><b id="stat-mana">100/100</b></div>
            <div class="stat"><span>法则</span><b id="stat-law">0</b></div>
            <div class="stat"><span>灵根</span><b id="stat-root">普通灵根</b></div>
            <div class="stat"><span>体质</span><b id="stat-physique">凡体</b></div>
            <div class="stat"><span>元素</span><b id="stat-elements">金·火</b></div>
            <div class="stat"><span>灵草</span><b id="stat-herb">0</b></div>
        </div>

        <div id="progress-wrap">
            <div id="progress-bar"></div>
            <div id="progress-text">0 / 10</div>
        </div>

        <div class="tabs">
            <button class="tab-btn active" data-tab="basic">基础</button>
            <button class="tab-btn" data-tab="social">社交</button>
            <button class="tab-btn" data-tab="explore">探索</button>
            <button class="tab-btn" data-tab="market">交易</button>
        </div>

        <div id="actions-basic" class="actions-group active">
            <button data-action="cultivate">☯ 打坐修炼</button>
            <button data-action="cultivate-mo">🌑 魔道修炼</button>
            <button data-action="fight">⚔️ 打怪</button>
            <button data-action="adventure">🗺 历练</button>
            <button data-action="breakthrough">⚡ 大境界突破</button>
            <button data-action="use-law">🔮 使用法则能量</button>
            <button data-action="shop">🏪 坊市</button>
            <button data-action="alchemy">⚗️ 炼丹炉</button>
            <button data-action="signin">🎁 每日签到</button>
            <button data-action="status">📖 查看详情</button>
            <button data-action="save">💾 手动存档</button>
            <button data-action="reset">🔄 重新开始</button>
        </div>

        <div id="actions-social" class="actions-group">
            <button data-action="sect">🏛️ 门派</button>
            <button data-action="master">🎓 拜师/收徒</button>
            <button data-action="partner">💍 道侣</button>
            <button data-action="duel">⚔️ 切磋</button>
            <button data-action="ranking">🏆 封神榜</button>
            <button data-action="achievement">📜 成就</button>
            <button data-action="title">🏅 称号</button>
        </div>

        <div id="actions-explore" class="actions-group">
            <button data-action="map">🌍 地图</button>
            <button data-action="boss">👹 世界BOSS</button>
            <button data-action="leyline">⚡ 灵脉争夺</button>
            <button data-action="daily">📅 每日任务</button>
            <button data-action="lottery">🎰 抽奖</button>
        </div>

        <div id="actions-market" class="actions-group">
            <button data-action="market">🏦 交易行</button>
            <button data-action="my-market">📦 我的挂单</button>
        </div>

        <div id="log"></div>

        <div id="chat-area">
            <div id="chat-log"></div>
            <div id="chat-input-wrap">
                <input type="text" id="chat-input" placeholder="聊天 / 指令（帮助 查看全部）" />
                <button id="chat-send">发送</button>
            </div>
        </div>
    </div>

    <script src="chat.js"></script>
    <script src="game.js"></script>
</body>
</html>
